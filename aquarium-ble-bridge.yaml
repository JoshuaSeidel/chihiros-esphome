# --- FULL BRIDGE: every supported Chihiros device ---
#
# Chihiros BLE bridge — CO2 controller + magnetic stirrer + cooling fan +
# Doctor Mate + WRGB2 light + dosing pump.
#
# This file is only glue. The board, radios and network live in
# aquarium-ble-bridge-core.yaml; each device is its own package. To build
# for a subset of devices, copy this file and drop the packages you do not
# own -- see aquarium-ble-bridge-wrgb2-only.yaml for a light-only example.
#
# The one piece of logic here is `schedule_changed`: when the photoperiod
# moves, which devices get told, and in what order. Connections are
# staggered because two simultaneous BLE connects trip HCI 0x07.

substitutions:
  name: aquarium-ble-bridge
  friendly_name: aquarium-ble-bridge
  # MAC addresses -- flash once with discovery enabled and read them from the log
  co2_mac:     "CC:A0:27:8E:79:E9"
  stirrer_mac: "EC:DE:A6:A0:61:1D"
  fan_mac:     "D7:65:2F:EF:CC:BB"
  doctor_mac:  "CC:A0:E9:07:34:C6"
  wrgb2_mac:   "CF:20:3B:6D:17:C1"
  dosing_mac:  "F1:C0:D0:B8:E9:5A"
  # Everything above, comma-separated, so discovery stops reporting them.
  known_macs:  "CC:A0:27:8E:79:E9,EC:DE:A6:A0:61:1D,D7:65:2F:EF:CC:BB,CC:A0:E9:07:34:C6,CF:20:3B:6D:17:C1,F1:C0:D0:B8:E9:5A"
  # The WRGB II Pro (DYWPRO30-90 / DYWPR120) has a fourth, independent white
  # channel. Set to "true" for a Pro; "false" leaves every frame byte-for-byte
  # identical for a regular WRGB II.
  wrgb2_pro:   "false"
  # Nordic UART Service UUIDs (shared by every Chihiros device)
  ble_service: "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
  ble_tx:      "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
  ble_rx:      "6e400003-b5a3-f393-e0a9-e50e24dcca9e"

external_components:
  - source:
      type: local
      path: components
    components: [chihiros_ble]

packages:
  core:     !include aquarium-ble-bridge-core.yaml
  discover: !include aquarium-ble-bridge-discover.yaml
  schedule: !include aquarium-ble-bridge-schedule.yaml
  stirrer:  !include aquarium-ble-bridge-stirrer.yaml
  fan:      !include aquarium-ble-bridge-fan.yaml
  doctor:   !include aquarium-ble-bridge-doctor.yaml
  wrgb2:    !include aquarium-ble-bridge-wrgb2.yaml
  co2:      !include aquarium-ble-bridge-co2.yaml
  dosing:   !include aquarium-ble-bridge-dosing.yaml

script:
  # Photoperiod moved: update CO2 first, then the light 3s later.
  - id: schedule_changed
    mode: restart
    then:
      - delay: 1500ms
      - script.execute: co2_connect_when_ready
      - delay: 3000ms
      - script.execute: wrgb2_connect_when_ready
