# --- DOSING PUMP ---
#
# Protocol derived from btsnoop HCI logs (2026-06-08):
#
# Connect:      auth(BASE,0x01) → RTC → RTC → auth_dose1(DEVICE,0x04) → auth_dose2(DEVICE,0x05)
# Schedule:     STIR_ENABLE + STIR_SPEED + STIR_TIMER per pump (see helpers in chihiros_ble.h)
# Manual:       STIR_SPEED [pump_idx, 0x00, 0x00, 0x00, vol_01ml]
#
# Hour encoding: the hour is split across STIR_TIMER[2]=hour>>1 and STIR_SPEED[2]=hour&1 (all hours 0-23)
# Weekdays:      same bitmask as WRGB2 — Mon=64 Tue=32 Wed=16 Thu=8 Fri=4 Sat=2 Sun=1
# Disable:       STIR_ENABLE with enable=false (0x00)
#
# Manual dosing is armed by calling set_manual_dose() on the device object
# before triggering the BLE connection; a schedule update sends all 4 pumps.

globals:
  - id: dosing_device
    type: chihiros::DosingDevice
    restore_value: false

ble_client:
  - mac_address: ${dosing_mac}
    id: chihiros_dosing
    on_connect:
      then:
        - delay: 500ms
        - lambda: |-
            bool    active[]   = {id(sw_dosing_schedule_p1).state, id(sw_dosing_schedule_p2).state,
                                  id(sw_dosing_schedule_p3).state, id(sw_dosing_schedule_p4).state};
            uint8_t weekdays[] = {(uint8_t)id(num_dosing_weekdays_p1).state, (uint8_t)id(num_dosing_weekdays_p2).state,
                                  (uint8_t)id(num_dosing_weekdays_p3).state, (uint8_t)id(num_dosing_weekdays_p4).state};
            uint8_t hour[]      = {(uint8_t)id(num_dosing_hour_p1).state, (uint8_t)id(num_dosing_hour_p2).state,
                                  (uint8_t)id(num_dosing_hour_p3).state, (uint8_t)id(num_dosing_hour_p4).state};
            uint8_t min_[]     = {(uint8_t)id(num_dosing_min_p1).state, (uint8_t)id(num_dosing_min_p2).state,
                                  (uint8_t)id(num_dosing_min_p3).state, (uint8_t)id(num_dosing_min_p4).state};
            float   vol[]      = {id(num_dosing_vol_p1).state, id(num_dosing_vol_p2).state,
                                  id(num_dosing_vol_p3).state, id(num_dosing_vol_p4).state};
            id(dosing_device).prepare(
              id(ntp_time).now(), active, weekdays, hour, min_, vol
            );
        - while:
            condition:
              lambda: return id(dosing_device).has_next();
            then:
              - ble_client.ble_write:
                  id: chihiros_dosing
                  service_uuid: ${ble_service}
                  characteristic_uuid: ${ble_tx}
                  value: !lambda return id(dosing_device).next();
              - delay: 200ms
        - switch.turn_off: dosing_connection
        - logger.log: "dosing: done"
    on_disconnect:
      then:
        - logger.log: "dosing: connection lost"

script:
  - id: dosing_connect_when_ready
    then:
      - if:
          condition:
            lambda: return id(ha_connected);
          then:
            - switch.turn_on: dosing_connection

  - id: dosing_debounce
    mode: restart
    then:
      - delay: 1500ms
      - script.execute: dosing_connect_when_ready


switch:
  - platform: ble_client
    ble_client_id: chihiros_dosing
    id: dosing_connection
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "Dosing schedule pump 1"
    id: sw_dosing_schedule_p1
    icon: mdi:calendar-clock
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    on_turn_on:
      - script.execute: dosing_connect_when_ready
    on_turn_off:
      - script.execute: dosing_connect_when_ready

  - platform: template
    name: "Dosing schedule pump 2"
    id: sw_dosing_schedule_p2
    icon: mdi:calendar-clock
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute: dosing_connect_when_ready
    on_turn_off:
      - script.execute: dosing_connect_when_ready

  - platform: template
    name: "Dosing schedule pump 3"
    id: sw_dosing_schedule_p3
    icon: mdi:calendar-clock
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute: dosing_connect_when_ready
    on_turn_off:
      - script.execute: dosing_connect_when_ready

  - platform: template
    name: "Dosing schedule pump 4"
    id: sw_dosing_schedule_p4
    icon: mdi:calendar-clock
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute: dosing_connect_when_ready
    on_turn_off:
      - script.execute: dosing_connect_when_ready

button:
  - platform: template
    name: "Dosing pump 1"
    id: btn_dosing_p1
    icon: mdi:eyedropper
    on_press:
      - lambda: id(dosing_device).set_manual_dose(0, (uint8_t)(id(num_dosing_vol_p1).state * 10.0f + 0.5f));
      - script.execute: dosing_connect_when_ready

  - platform: template
    name: "Dosing pump 2"
    id: btn_dosing_p2
    icon: mdi:eyedropper
    on_press:
      - lambda: id(dosing_device).set_manual_dose(1, (uint8_t)(id(num_dosing_vol_p2).state * 10.0f + 0.5f));
      - script.execute: dosing_connect_when_ready

  - platform: template
    name: "Dosing pump 3"
    id: btn_dosing_p3
    icon: mdi:eyedropper
    on_press:
      - lambda: id(dosing_device).set_manual_dose(2, (uint8_t)(id(num_dosing_vol_p3).state * 10.0f + 0.5f));
      - script.execute: dosing_connect_when_ready

  - platform: template
    name: "Dosing pump 4"
    id: btn_dosing_p4
    icon: mdi:eyedropper
    on_press:
      - lambda: id(dosing_device).set_manual_dose(3, (uint8_t)(id(num_dosing_vol_p4).state * 10.0f + 0.5f));
      - script.execute: dosing_connect_when_ready

number:
  # Volume per pump (manual dose + schedule)
  - platform: template
    name: "Dosing pump 1 volume"
    id: num_dosing_vol_p1
    min_value: 0.5
    max_value: 25.5
    step: 0.5
    initial_value: 1.0
    restore_value: true
    unit_of_measurement: "mL"
    optimistic: true
    icon: mdi:water
    on_value:
      - script.execute: dosing_debounce

  - platform: template
    name: "Dosing pump 2 volume"
    id: num_dosing_vol_p2
    min_value: 0.5
    max_value: 25.5
    step: 0.5
    initial_value: 10.0
    restore_value: true
    unit_of_measurement: "mL"
    optimistic: true
    icon: mdi:water
    on_value:
      - script.execute: dosing_debounce

  - platform: template
    name: "Dosing pump 3 volume"
    id: num_dosing_vol_p3
    min_value: 0.5
    max_value: 25.5
    step: 0.5
    initial_value: 1.0
    restore_value: true
    unit_of_measurement: "mL"
    optimistic: true
    icon: mdi:water
    on_value:
      - script.execute: dosing_debounce

  - platform: template
    name: "Dosing pump 4 volume"
    id: num_dosing_vol_p4
    min_value: 0.5
    max_value: 25.5
    step: 0.5
    initial_value: 1.0
    restore_value: true
    unit_of_measurement: "mL"
    optimistic: true
    icon: mdi:water
    on_value:
      - script.execute: dosing_debounce

  # Schedule hour per pump
  - platform: template
    name: "Dosing schedule pump 1 hour"
    id: num_dosing_hour_p1
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 9
    restore_value: true
    unit_of_measurement: "u"
    optimistic: true
    icon: mdi:clock-outline
    on_value:
      - script.execute: dosing_debounce

  - platform: template
    name: "Dosing schedule pump 2 hour"
    id: num_dosing_hour_p2
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 17
    restore_value: true
    unit_of_measurement: "u"
    optimistic: true
    icon: mdi:clock-outline
    on_value:
      - script.execute: dosing_debounce

  - platform: template
    name: "Dosing schedule pump 3 hour"
    id: num_dosing_hour_p3
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 9
    restore_value: true
    unit_of_measurement: "u"
    optimistic: true
    icon: mdi:clock-outline
    on_value:
      - script.execute: dosing_debounce

  - platform: template
    name: "Dosing schedule pump 4 hour"
    id: num_dosing_hour_p4
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 9
    restore_value: true
    unit_of_measurement: "u"
    optimistic: true
    icon: mdi:clock-outline
    on_value:
      - script.execute: dosing_debounce

  # Schedule minute per pump
  - platform: template
    name: "Dosing schedule pump 1 minute"
    id: num_dosing_min_p1
    min_value: 0
    max_value: 59
    step: 1
    initial_value: 0
    restore_value: true
    unit_of_measurement: "min"
    optimistic: true
    icon: mdi:clock-outline
    on_value:
      - script.execute: dosing_debounce

  - platform: template
    name: "Dosing schedule pump 2 minute"
    id: num_dosing_min_p2
    min_value: 0
    max_value: 59
    step: 1
    initial_value: 0
    restore_value: true
    unit_of_measurement: "min"
    optimistic: true
