    initial_value: 127
    restore_value: true
    optimistic: true
    icon: mdi:calendar-week
    on_value:
      - script.execute: dosing_debounce

sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: chihiros_dosing
    service_uuid: ${ble_service}
    characteristic_uuid: ${ble_rx}
    id: dosing_notification
    name: "Dosing notification"
    notify: true
    internal: true
    unit_of_measurement: ""
    lambda: |-
      ESP_LOGI("dosing", "Notification (%d bytes): %s", (int)x.size(), chihiros::hex_dump(x).c_str());
      return NAN;
