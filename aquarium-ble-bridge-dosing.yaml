    on_value:
      - script.execute: dosing_debounce

  - platform: template
    name: "Dosing schedule pump 3 minute"
    id: num_dosing_min_p3
    min_value: 0
    max_value: 59
    step: 1
    initial_value: 0
    restore_value: true
    unit_of_measurement: "min"
    optimistic: true
    icon: mdi:clock-outline
    on_value:
      - script.execute: dosing_debounce

  - platform: template
    name: "Dosing schedule pump 4 minute"
    id: num_dosing_min_p4
    min_value: 0
    max_value: 59
    step: 1
