# --- MAGNETIC STIRRER ---
#
# The Chihiros magnetic stirrer has 4 independent channels (0-3).
# Each channel has:
#   - speed (0-20, app scale) → CMD_2A byte[3]
#   - lead time (seconds) → CMD_2A byte[2]: the stirrer starts X sec before the start time
#   - start time (hour + minute) → STIR_TIMER mode 3 byte[2/3]
#   - duration (seconds) → STIR_TIMER mode 3 byte[5]
#   - weekdays → STIR_SPEED byte[1], always 0x7f (every day)
#
# Connection sequence on every BLE connect:
#   1. Auth       — announces us to the device
#   2. RTC sync   — syncs the stirrer's internal clock
#   3. Config     — STIR_ENABLE + STIR_SPEED(weekdays) + CMD_2A + STIR_TIMER per channel → APPLY
#   4. State      — restores which channels should be on/off (STIR_TOGGLE)
#
# Why globals for the on/off state?
#   The ESP32 crashes regularly under BLE-stack pressure (multiple clients + scanner).
#   After a crash and restart, ESPHome sends the current switch state to HA.
#   With restore_value:true the globals are restored from flash, so
#   lambda: return id(stirrer_kX_on) reports the correct state back to HA —
#   even when the ESP32 has only just rebooted.

globals:
  - id: stirrer_k0_on
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: stirrer_k1_on
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: stirrer_k2_on
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: stirrer_k3_on
    type: bool
    restore_value: true
    initial_value: 'false'

  - id: stirrer_device
    type: chihiros::StirrerDevice
    restore_value: false

ble_client:
  - mac_address: ${stirrer_mac}
    id: chihiros_stirrer
    on_connect:
      then:
        - delay: 500ms
        - lambda: |-
            uint8_t hour[]  = {(uint8_t)id(stirrer_k0_start_hour).state, (uint8_t)id(stirrer_k1_start_hour).state,
                              (uint8_t)id(stirrer_k2_start_hour).state, (uint8_t)id(stirrer_k3_start_hour).state};
            uint8_t min_[] = {(uint8_t)id(stirrer_k0_start_min).state, (uint8_t)id(stirrer_k1_start_min).state,
                              (uint8_t)id(stirrer_k2_start_min).state, (uint8_t)id(stirrer_k3_start_min).state};
            uint8_t vrlp[] = {(uint8_t)id(stirrer_k0_lead).state, (uint8_t)id(stirrer_k1_lead).state,
                              (uint8_t)id(stirrer_k2_lead).state, (uint8_t)id(stirrer_k3_lead).state};
            uint8_t spd[]  = {(uint8_t)id(stirrer_k0_speed).state, (uint8_t)id(stirrer_k1_speed).state,
                              (uint8_t)id(stirrer_k2_speed).state, (uint8_t)id(stirrer_k3_speed).state};
            uint8_t dur[]  = {(uint8_t)id(stirrer_k0_duration).state, (uint8_t)id(stirrer_k1_duration).state,
                              (uint8_t)id(stirrer_k2_duration).state, (uint8_t)id(stirrer_k3_duration).state};
            id(stirrer_device).prepare(
              id(ntp_time).now(), hour, min_, vrlp, spd, dur,
              id(stirrer_k0_on), id(stirrer_k1_on), id(stirrer_k2_on), id(stirrer_k3_on)
            );
        - while:
            condition:
              lambda: return id(stirrer_device).has_next();
            then:
              - ble_client.ble_write:
                  id: chihiros_stirrer
                  service_uuid: ${ble_service}
                  characteristic_uuid: ${ble_tx}
                  value: !lambda return id(stirrer_device).next();
              - delay: 200ms
        - switch.turn_off: stirrer_connection
        - logger.log: "stirrer: done"
    on_disconnect:
      then:
        - logger.log: "stirrer: connection lost"

script:
  - id: stirrer_connect_when_ready
    then:
      - if:
          condition:
            lambda: return id(ha_connected);
          then:
            - switch.turn_on: stirrer_connection


switch:
  - platform: ble_client
    ble_client_id: chihiros_stirrer
    id: stirrer_connection
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "Stirrer channel 0"
    id: stirrer_sw_k0
    icon: mdi:rotate-3d-variant
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: return id(stirrer_k0_on);
    turn_on_action:
      - globals.set:
          id: stirrer_k0_on
          value: 'true'
    turn_off_action:
      - globals.set:
          id: stirrer_k0_on
          value: 'false'

  - platform: template
    name: "Stirrer channel 1"
    id: stirrer_sw_k1
    icon: mdi:rotate-3d-variant
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: return id(stirrer_k1_on);
    turn_on_action:
      - globals.set:
          id: stirrer_k1_on
          value: 'true'
    turn_off_action:
      - globals.set:
          id: stirrer_k1_on
          value: 'false'

  - platform: template
    name: "Stirrer channel 2"
    id: stirrer_sw_k2
    icon: mdi:rotate-3d-variant
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: return id(stirrer_k2_on);
    turn_on_action:
