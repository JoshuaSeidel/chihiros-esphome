          id: stirrer_k3_on
          value: 'false'

button:
  - platform: template
    name: "Stirrer apply schedule"
    id: btn_stirrer_config
    icon: mdi:content-save-cog
    on_press:
      - script.execute: stirrer_connect_when_ready

  - platform: template
    name: "Stirrer RTC sync"
    id: btn_stirrer_rtc_sync
    icon: mdi:clock-sync
    on_press:
      - lambda: id(stirrer_device).set_rtc_only();
      - script.execute: stirrer_connect_when_ready

