# --- WRGB II LED ---
#
# Protocol derived from btsnoop HCI logs (2026-05-30):
#
# Connect:          AUTH(0x5a) → RTC → RTC  (the lamp keeps its own schedule)
# Activate auto:    MODE(RESET_AUTO) → MODE(0x05) → SCHEDULE(params)
# Deactivate auto:  SCHEDULE(delete: R/G/B=0xff) + MODE(0x28)  [2x]
# Manual:           BRIGHTNESS per channel
# Manual → auto:    MODE(RESET_AUTO) → MODE(0x05) → SCHEDULE
#
# SCHEDULE: hdr::DEVICE(0xa5), cmd=0x19
#   data: [on_h, on_m, off_h, off_m, ramp_min, weekdays=0x7f, R, G, B, W, 0xff x4]
#   Delete = R/G/B = 0xff
#   W = white channel on the WRGB II Pro; 0xff (SKIP) on a regular WRGB II
# BRIGHTNESS: hdr::BASE(0x5a), cmd=0x07, data=[channel, value]  (0=R, 1=G, 2=B, 3=W)
#
# WRGB II PRO: "true WRGB" with four independent channels. Set wrgb2_pro: "true"
# in the substitutions; otherwise the white channel is never addressed and the
# behaviour is identical to a regular WRGB II. Name prefix DYWPRO (30-90) or
# DYWPR120 — channel order and frame encoding are otherwise the same.
#
# CONNECTION: non-persistent — connect → init (schedule or brightness) → disconnect.
# The lamp keeps its schedule on its own internal RTC; BLE is only needed to
# push a schedule update.
#
# IMPORTANT: the sequence byte must never be 90 (=0x5a = frame header) → next_seq()
# A ramp value of 90 min is likewise forbidden → rounded to 89 min.

globals:
  - id: wrgb2_auto_mode
    type: bool
    restore_value: false
    initial_value: 'true'

  - id: wrgb2_device
    type: chihiros::WRGB2Device
    restore_value: false

  # From substitutions; decides whether the white channel is sent.
  - id: wrgb2_has_white
    type: bool
    restore_value: false
    initial_value: '${wrgb2_pro}'

ble_client:
  - mac_address: ${wrgb2_mac}
    id: chihiros_wrgb2
    on_connect:
      then:
        - delay: 500ms
        - lambda: |-
            id(wrgb2_device).prepare(
              id(ntp_time).now(), id(wrgb2_auto_mode),
              id(photoperiod_start).hour, id(photoperiod_start).minute,
              id(photoperiod_end).hour,  id(photoperiod_end).minute,
              (uint8_t)id(wrgb2_ramp).state,
              (uint8_t)id(wrgb2_schedule_red).state,
              (uint8_t)id(wrgb2_schedule_green).state,
              (uint8_t)id(wrgb2_schedule_blue).state,
              id(wrgb2_has_white) ? (uint8_t)id(wrgb2_schedule_white).state
                                  : chihiros::data::SKIP
            );
        - while:
            condition:
              lambda: return id(wrgb2_device).has_next();
            then:
              - ble_client.ble_write:
                  id: chihiros_wrgb2
                  service_uuid: ${ble_service}
                  characteristic_uuid: ${ble_tx}
                  value: !lambda return id(wrgb2_device).next();
              - delay: 200ms
        - switch.turn_off: wrgb2_connection
        - logger.log: "wrgb2: done"
    on_disconnect:
      then:
        - logger.log: "wrgb2: connection lost"

script:
  - id: wrgb2_connect_when_ready
    then:
      - if:
          condition:
            lambda: return id(ha_connected);
          then:
            - switch.turn_on: wrgb2_connection

  # Only connect in manual mode — avoids needless reconnects on slider changes
  - id: wrgb2_connect_when_ready_manual
    then:
      - if:
          condition:
            lambda: return id(ha_connected) && !id(wrgb2_auto_mode);
          then:
            - switch.turn_on: wrgb2_connection

  - id: wrgb2_debounce_manual
    mode: restart
    then:
      - delay: 1500ms
      - script.execute: wrgb2_connect_when_ready_manual


switch:
  - platform: ble_client
    ble_client_id: chihiros_wrgb2
    id: wrgb2_connection
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "WRGB2 auto mode"
    id: sw_wrgb2_auto
    icon: mdi:clock-outline
    restore_mode: ALWAYS_ON
    lambda: return id(wrgb2_auto_mode);
    turn_on_action:
      - globals.set:
          id: wrgb2_auto_mode
          value: 'true'
      - script.execute: wrgb2_connect_when_ready
    turn_off_action:
      - globals.set:
          id: wrgb2_auto_mode
          value: 'false'
      - script.execute: wrgb2_connect_when_ready

number:
  - platform: template
    name: "WRGB2 red"
    id: num_wrgb2_r
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    restore_value: true
    icon: mdi:led-on
    unit_of_measurement: "%"
    optimistic: true
    on_value:
      - script.execute: wrgb2_debounce_manual

  - platform: template
    name: "WRGB2 green"
    id: num_wrgb2_g
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    restore_value: true
    icon: mdi:led-on
    unit_of_measurement: "%"
    optimistic: true
    on_value:
      - script.execute: wrgb2_debounce_manual

  - platform: template
    name: "WRGB2 blue"
    id: num_wrgb2_b
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    restore_value: true
    icon: mdi:led-on
    unit_of_measurement: "%"
    optimistic: true
    on_value:
      - script.execute: wrgb2_debounce_manual

  # Only meaningful on a WRGB II Pro (wrgb2_pro: "true").
  - platform: template
    name: "WRGB2 white"
    id: num_wrgb2_w
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    restore_value: true
    icon: mdi:led-on
    unit_of_measurement: "%"
    optimistic: true
    on_value:
      - script.execute: wrgb2_debounce_manual

  - platform: template
    name: "WRGB2 schedule ramp"
    id: wrgb2_ramp
    min_value: 0
    max_value: 150
    step: 5
    initial_value: 30
    restore_value: true
    optimistic: true
    unit_of_measurement: "min"
    icon: mdi:sun-angle

  - platform: template
    name: "WRGB2 schedule red"
    id: wrgb2_schedule_red
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 61
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"
    icon: mdi:led-on

  - platform: template
    name: "WRGB2 schedule green"
    id: wrgb2_schedule_green
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 45
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"
    icon: mdi:led-on

  - platform: template
    name: "WRGB2 schedule blue"
    id: wrgb2_schedule_blue
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 80
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"
    icon: mdi:led-on

  # Only meaningful on a WRGB II Pro (wrgb2_pro: "true").
  - platform: template
    name: "WRGB2 schedule white"
    id: wrgb2_schedule_white
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"
    icon: mdi:led-on

button:
  - platform: template
    name: "WRGB2 apply schedule"
    id: btn_wrgb2_schedule
    icon: mdi:clock-edit
    on_press:
      - script.execute: wrgb2_connect_when_ready

  - platform: template
    name: "WRGB2 RTC sync"
    id: btn_wrgb2_rtc_sync
    icon: mdi:clock-sync
    on_press:
      - lambda: id(wrgb2_device).set_rtc_only();
      - script.execute: wrgb2_connect_when_ready

sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: chihiros_wrgb2
    service_uuid: ${ble_service}
    characteristic_uuid: ${ble_rx}
    id: wrgb2_notification
    name: "WRGB2 notification"
    notify: true
    internal: true
    unit_of_measurement: ""
    lambda: |-
      ESP_LOGI("wrgb2", "Notification (%d bytes): %s", (int)x.size(), chihiros::hex_dump(x).c_str());
      return NAN;
