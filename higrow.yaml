esphome:
  name: "higrow"
  # Sensoren worden gelezen nadat WiFi + MQTT verbonden zijn
  on_boot:
    priority: 200.0
    then:
      - switch.turn_on: power_sensors
      - delay: 2s             # DHT11 heeft ≥1s opwarmtijd; 2s geeft marge
      # Bodemvocht: 5× meten met 200ms tussentijd zodat de mediaanfilter werkt
      - repeat:
          count: 5
          then:
            - component.update: soil_moisture
            - delay: 200ms
      - component.update: temperature_humidity
      - component.update: battery_voltage
      - switch.turn_off: power_sensors  # GPIO4 laag voor deep sleep zodat sensors geen stroom trekken

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

# Deep sleep: 30 min slapen, 10s wakker voor metingen
# OTA-override: stuur MQTT retained "ON" naar plant_sensor/ota_mode om wakker te houden
deep_sleep:
  id: deep_sleep_control
  sleep_duration: 30min
  run_duration: 10s           # WiFi fast_connect (~2s) + MQTT + 2s delay + metingen (~3s) = ~7s

# MQTT BYPASS: Prevents persistent TCP socket stalls caused by the native HA API
mqtt:
  broker: !secret mqtt_broker
  topic_prefix: plant_sensor
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  # OTA-override: behoud retained "ON" bericht op plant_sensor/ota_mode om wakker te blijven
  # Zet terug op "OFF" (retained) om deep sleep te hervatten
  on_message:
    - topic: plant_sensor/ota_mode
      payload: "ON"
      then:
        - deep_sleep.prevent: deep_sleep_control

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  fast_connect: true
  power_save_mode: NONE
  post_connect_roaming: false
  reboot_timeout: 0s          # Met deep sleep is periodieke herstart overbodig

ota:
  - platform: esphome

# Controls the physical power rail to the sensors to stop deep-sleep battery drain
switch:
  - platform: gpio
    pin: GPIO4                 # Pin 4 controls sensor power lines on LilyGO hardware
    id: power_sensors
    internal: true
    restore_mode: ALWAYS_OFF

sensor:
  # The Capacitive Soil Probe Tracker
  - platform: adc
    pin: GPIO32
    id: soil_moisture
    name: "Soil Moisture"
    update_interval: never     # Aangestuurd via on_boot (5× herhaling voor mediaanfilter)
    attenuation: 12db          # ESP32 ADC bereik 0–3.9V; zonder dit max ~1.1V (BUGFIX)
    device_class: moisture
    unit_of_measurement: "%"
    filters:
      - median:                # Pakt mediaan van 5 metingen om ruis te onderdrukken
          window_size: 5
          send_every: 5
      - calibrate_linear:      # Gekalibreerd 2026-05-26: droog=2.86V, nat=1.464V
          - 2.86 -> 0.0
          - 1.464 -> 100.0
      - lambda: |-             # Klem: waarden buiten 0–100% zijn onmogelijk
          if (x < 0.0) return 0.0;
          if (x > 100.0) return 100.0;
          return x;


  # Onboard Temperature & Humidity Sensor
  - platform: dht
    pin:
      number: GPIO16
      mode:
        input: true
        pullup: true          # DHT11 heeft een pull-up nodig op de datalijn
    model: DHT11
    id: temperature_humidity
    temperature:
      name: "Plant Temperature"
      device_class: temperature
      unit_of_measurement: "°C"
      accuracy_decimals: 1
    humidity:
      name: "Plant Humidity"
      device_class: humidity
      unit_of_measurement: "%"
      accuracy_decimals: 0
    update_interval: never

  # 18650 Battery Voltage Diagnostics Tracker
  - platform: adc
    pin: GPIO33
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: never
    attenuation: 12db          # ESP32 ADC bereik 0–3.9V; zonder dit max ~1.1V (BUGFIX)
    device_class: voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 2.0          # Compenseert de ingebouwde 1:1 spanningsdeler

  # 18650 Battery Level (%)
  # Copy van battery_voltage — zelfde meting, andere schaal
  # Bereik: 3.0V (leeg) → 4.2V (vol); op lader kan >100% zijn → geklemd op 0–100
  - platform: copy
    source_id: battery_voltage
    name: "Battery Level"
    id: battery_level
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 3.0 -> 0.0
          - 4.2 -> 100.0
      - lambda: |-
          if (x < 0.0) return 0.0;
          if (x > 100.0) return 100.0;
          return x;

# Shuts down standard serial debugging to stop UART current draw
logger:
  baud_rate: 0
