# --- LIGHT-ONLY BRIDGE: one WRGB II / WRGB II Pro, nothing else ---
#
# A STANDALONE REMOTE CONFIG. Copy this one file into any ESPHome dashboard;
# everything else -- the C++ protocol helpers and every package -- is pulled
# from this repository's main branch at build time, refreshed on every build.
# Nothing needs to live next to it except secrets.yaml.
#
# It carries only the light. No CO2, stirrer, fan, Doctor Mate or dosing
# entities you would never use. For the full bridge, or for local
# development against the working tree, use aquarium-ble-bridge.yaml.
#
# Secret key names match the tank-monitor project:
#   wifi_ssid, wifi_password, timezone, tank_monitor_ota_password,
#   tank_monitor_api_key  (openssl rand -base64 32)

substitutions:
  name: aquarium-light-bridge
  friendly_name: aquarium-light-bridge
  # Flash once with discovery enabled and read the MAC from the log. A Pro
  # advertises as DYWPRO30-90 or DYWPR120 (the 120 drops the O).
  wrgb2_mac:   "CF:20:3B:6D:17:C1"
  known_macs:  "CF:20:3B:6D:17:C1"
  # "true" for a WRGB II Pro (four channels), "false" for a regular WRGB II.
  wrgb2_pro:   "true"
  ble_service: "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
  ble_tx:      "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
  ble_rx:      "6e400003-b5a3-f393-e0a9-e50e24dcca9e"

# Pulled from git, not local: this file has to work when it is the ONLY
# file in the dashboard. refresh 0s so a push to main is all the next build
# needs -- the default of 1d would silently build yesterday's code.
external_components:
  - source:
      type: git
      url: https://github.com/JoshuaSeidel/chihiros-esphome
      ref: main
    components: [chihiros_ble]
    refresh: 0s

packages:
  chihiros:
    url: https://github.com/JoshuaSeidel/chihiros-esphome
    ref: main
    files:
      - aquarium-ble-bridge-core.yaml
      # Optional: logs any Chihiros device in range not in known_macs.
      # Keep for the first flash to find the MAC; drop later for a quiet log.
      - aquarium-ble-bridge-discover.yaml
      - aquarium-ble-bridge-schedule.yaml
      - aquarium-ble-bridge-wrgb2.yaml
    refresh: 0s

script:
  # Photoperiod moved: only the light to tell.
  - id: schedule_changed
    mode: restart
    then:
      - delay: 1500ms
      - script.execute: wrgb2_connect_when_ready
