# --- CO2 CONTROLLER ---

#
# Protocol derived from btsnoop HCI logs (2026-05-30):
#
# Connect:    AUTH → RTC → RTC → RESET_SCHEDULE → start→ON → end→OFF
# Activate:   RESET_SCHEDULE → start→ON → end→OFF
# Deactivate: start→EMPTY → end→EMPTY
#
# NOTE: the CO2 valve physically clicks on every connect (RESET_SCHEDULE
# triggers actuation). Only connect when genuinely needed — never poll.
#
# RESET_SCHEDULE clears every slot on the device, so no old values are needed
# when a time changes. RTC is sent twice, matching the app's behaviour.

globals:
  - id: co2_schedule_active
    type: bool
    restore_value: true
    initial_value: 'true'

  - id: co2_device
    type: chihiros::CO2Device
    restore_value: false

ble_client:
  - mac_address: ${co2_mac}
    id: chihiros_co2
    on_connect:
      then:
        - delay: 500ms
        - lambda: |-
            id(co2_device).prepare(
              id(ntp_time).now(), id(co2_schedule_active),
              id(photoperiod_start).hour, id(photoperiod_start).minute,
              id(photoperiod_end).hour,  id(photoperiod_end).minute,
              (int)id(co2_prestart).state
            );
        - while:
            condition:
              lambda: return id(co2_device).has_next();
            then:
              - ble_client.ble_write:
                  id: chihiros_co2
                  service_uuid: ${ble_service}
                  characteristic_uuid: ${ble_tx}
                  value: !lambda return id(co2_device).next();
              - delay: 200ms
        - switch.turn_off: co2_connection
        - logger.log: "co2: done"
    on_disconnect:
      then:
        - logger.log: "co2: connection lost"

script:
  # A prestart change only affects CO2, so it does not go through
  # schedule_changed -- no reason to reconnect the light for it.
  - id: co2_schedule_debounce
    mode: restart
    then:
      - delay: 1500ms
      - script.execute: co2_connect_when_ready

  - id: co2_connect_when_ready
    then:
      - if:
          condition:
            lambda: return id(ha_connected);
          then:
            - switch.turn_on: co2_connection

switch:
  - platform: ble_client
    ble_client_id: chihiros_co2
    id: co2_connection
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "CO2 schedule active"
    id: sw_co2_schedule_active
    icon: mdi:molecule-co2
    restore_mode: RESTORE_DEFAULT_ON
    lambda: return id(co2_schedule_active);
    turn_on_action:
      - globals.set:
          id: co2_schedule_active
          value: 'true'
      - script.execute: co2_connect_when_ready
    turn_off_action:
      - globals.set:
          id: co2_schedule_active
          value: 'false'
      - script.execute: co2_connect_when_ready

button:
  - platform: template
    name: "CO2 send schedule"
    id: btn_co2_schedule
    icon: mdi:molecule-co2
    on_press:
      - script.execute: co2_connect_when_ready

  - platform: template
    name: "CO2 RTC sync"
    id: btn_co2_rtc_sync
    icon: mdi:clock-sync
    on_press:
      - lambda: id(co2_device).set_rtc_only();
      - script.execute: co2_connect_when_ready

sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: chihiros_co2
    service_uuid: ${ble_service}
    characteristic_uuid: ${ble_rx}
    id: co2_status_raw
    name: "CO2 Status"
    notify: true
    internal: true
    unit_of_measurement: ""
    lambda: |-
      ESP_LOGI("co2", "Notification: %s", chihiros::hex_dump(x).c_str());
      if (x.size() >= 7) return (float)x[6];
      return NAN;

number:
  # Minutes before photoperiod_start that CO2 switches on. Lives here rather
  # than in the schedule package because it is a CO2 concern.
  - platform: template
    id: co2_prestart
    name: "CO2 prestart"
    min_value: 0
    max_value: 180
    step: 5
    initial_value: 90
    restore_value: true
    optimistic: true
    unit_of_measurement: "min"
    icon: mdi:clock-minus
    on_value:
      - script.execute: co2_schedule_debounce
