# --- PHOTOPERIOD SCHEDULE ---
#
# The shared timeline that CO2 and WRGB2 both align to:
#   CO2 on:    photoperiod_start - co2_prestart (minutes)
#   CO2 off:   photoperiod_end
#   WRGB2 on:  photoperiod_start
#   WRGB2 off: photoperiod_end
#
# A change triggers schedule_debounce_both (CO2 first, WRGB2 3s later).
# Staggering the connections avoids simultaneous BLE connects (HCI 0x07).

script:
  # Update both devices — staggered connection
  - id: schedule_debounce_both
    mode: restart
    then:
      - delay: 1500ms
      - script.execute: co2_connect_when_ready
      - delay: 3000ms
      - script.execute: wrgb2_connect_when_ready

  # Update CO2 only (co2_prestart changed)
  - id: schedule_debounce_co2
    mode: restart
    then:
      - delay: 1500ms
      - script.execute: co2_connect_when_ready

datetime:
  - platform: template
    id: photoperiod_start
    name: "Photoperiod start"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "14:00:00"
    icon: mdi:weather-sunset-up
    on_value:
      - script.execute: schedule_debounce_both

  - platform: template
    id: photoperiod_end
    name: "Photoperiod end"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "21:00:00"
    icon: mdi:weather-sunset-down
    on_value:
      - script.execute: schedule_debounce_both

number:
  - platform: template
    id: co2_prestart
    name: "CO2 prestart"
    min_value: 0
    max_value: 180
    step: 5
    initial_value: 90
    restore_value: true
    optimistic: true
    unit_of_measurement: "min"
    icon: mdi:clock-minus
    on_value:
      - script.execute: schedule_debounce_co2
