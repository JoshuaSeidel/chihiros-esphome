# --- PHOTOPERIOD SCHEDULE ---
#
# The shared timeline that light and CO2 align to:
#   WRGB2 on:  photoperiod_start          WRGB2 off: photoperiod_end
#   CO2 on:    photoperiod_start - co2_prestart (defined in the CO2 package)
#   CO2 off:   photoperiod_end
#
# A change runs `schedule_changed`. That script is NOT defined here -- the
# top-level file defines it and lists which devices to notify, staggered so
# two BLE connects never overlap (HCI 0x07 Memory Full). A light-only build
# therefore never references a CO2 script it did not load.

datetime:
  - platform: template
    id: photoperiod_start
    name: "Photoperiod start"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "14:00:00"
    icon: mdi:weather-sunset-up
    on_value:
      - script.execute: schedule_changed

  - platform: template
    id: photoperiod_end
    name: "Photoperiod end"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "21:00:00"
    icon: mdi:weather-sunset-down
    on_value:
      - script.execute: schedule_changed
