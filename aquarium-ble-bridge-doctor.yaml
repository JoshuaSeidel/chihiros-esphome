# --- DOCTOR MATE ---
#
# The Chihiros Doctor Mate measures water quality (EC/TDS) and doses automatically.
#
# Connection sequence on every BLE connect:
#   1. Auth        — standard Chihiros handshake (0xa5)
#   2. RTC sync    — sync the clock (0x5a)
#   3. TDS target  — target EC in µS/cm, cmd=0x01 data=[0x00, ec] (position 1)
#   4. Volume      — tank volume in litres x 2, cmd=0x01 data=[0x00, vol] (position 2)
#
# IMPORTANT: TDS and Volume share exactly the same frame format (cmd=0x01, data[0]=0x00).
# The device tells them apart ONLY by order: 1st = TDS, 2nd = Volume.
# Always send both on every settings update, always in this order.
#
# EC encoding: µS/cm = ppm / 0.4  (100 ppm = 250 µS/cm = 0xfa, max ~102 ppm)
# Volume encoding: litres x 2     (50 L = 0x64, 100 L = 0xc8, max ~127 L)
#
# Profiles (TDS presets):
#   Plant:  80 ppm → EC 200 µS/cm → 0xc8
#   Fish:   93 ppm → EC 233 µS/cm → 0xe9
#   Shrimp: 66 ppm → EC 166 µS/cm → 0xa6
#
# Notifications from the device (after auth):
#   byte[5] = EC reading (µS/cm) — presumed, confirm via logs

globals:
  - id: doctor_device
    type: chihiros::DoctorDevice
    restore_value: false

ble_client:
  - mac_address: ${doctor_mac}
    id: chihiros_doctor
    on_connect:
      then:
        - delay: 500ms
        - lambda: |-
            id(doctor_device).prepare(
              id(ntp_time).now(),
              id(num_doctor_tds).state,
              id(num_doctor_volume).state
            );
        - while:
            condition:
              lambda: return id(doctor_device).has_next();
            then:
              - ble_client.ble_write:
                  id: chihiros_doctor
                  service_uuid: ${ble_service}
                  characteristic_uuid: ${ble_tx}
                  value: !lambda return id(doctor_device).next();
              - delay: 200ms
        - switch.turn_off: doctor_connection
        - logger.log: "doctor: done"
    on_disconnect:
      then:
        - logger.log: "doctor: connection lost"

script:
  - id: doctor_connect_when_ready
    then:
      - if:
          condition:
            lambda: return id(ha_connected);
          then:
            - switch.turn_on: doctor_connection

  - id: doctor_debounce
    mode: restart
    then:
      - delay: 1500ms
      - script.execute: doctor_connect_when_ready


switch:
  - platform: ble_client
    ble_client_id: chihiros_doctor
    id: doctor_connection
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF

button:
  - platform: template
    name: "Doctor Mate RTC sync"
    id: btn_doctor_rtc_sync
    icon: mdi:clock-sync
    on_press:
      - lambda: id(doctor_device).set_rtc_only();
      - script.execute: doctor_connect_when_ready

number:
  - platform: template
    name: "Doctor Mate TDS"
    id: num_doctor_tds
    min_value: 10
    max_value: 200
    step: 1
    initial_value: 130
    restore_value: false
    icon: mdi:water-check
    unit_of_measurement: "ppm"
    optimistic: true
    on_value:
      - script.execute: doctor_debounce

  - platform: template
    name: "Doctor Mate volume"
    id: num_doctor_volume
    min_value: 10
    max_value: 127
    step: 1
    initial_value: 125
    restore_value: true
    icon: mdi:water
    unit_of_measurement: "L"
    optimistic: true
    on_value:
      - script.execute: doctor_debounce

select:
  - platform: template
    name: "Doctor Mate profile"
    id: sel_doctor_profile
    icon: mdi:fish
    restore_value: true
    optimistic: true
    options:
      - "Plant (80 ppm)"
      - "Vis (93 ppm)"
      - "Garnaal (66 ppm)"
      - "Manueel"
    initial_option: "Manueel"
    on_value:
      # Choosing a profile sets the TDS value; num_doctor_tds.on_value then triggers the connection
      - if:
          condition:
            lambda: return x == "Plant (80 ppm)";
          then:
            - number.set:
                id: num_doctor_tds
                value: 80
      - if:
          condition:
            lambda: return x == "Vis (93 ppm)";
          then:
            - number.set:
                id: num_doctor_tds
                value: 93
      - if:
          condition:
            lambda: return x == "Garnaal (66 ppm)";
          then:
            - number.set:
                id: num_doctor_tds
                value: 66

sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: chihiros_doctor
    service_uuid: ${ble_service}
    characteristic_uuid: ${ble_rx}
    id: doctor_notification
    name: "Doctor Mate notification"
    notify: true
    internal: true
    unit_of_measurement: ""
    lambda: |-
      ESP_LOGI("doctor", "Notification (%d bytes): %s", (int)x.size(), chihiros::hex_dump(x).c_str());
      if (x.size() >= 6 && x[5] > 0 && x[5] != 0xff) {
        id(sensor_doctor_ec).publish_state((float)x[5]);
      }
      return NAN;

  - platform: template
    id: sensor_doctor_ec
    name: "Doctor Mate EC"
    unit_of_measurement: "µS/cm"
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:water-percent
